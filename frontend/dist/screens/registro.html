<script>
        // Simple Micro-interaction for form submission
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> <span>Â¡Cuenta creada!</span>';
                btn.classList.replace('bg-primary-container', 'bg-on-tertiary-container');
                btn.classList.remove('opacity-80');
                
                // Reset after 2 seconds
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-on-tertiary-container', 'bg-primary-container');
                    btn.classList.remove('pointer-events-none');
                }, 2000);
            }, 1500);
        });

        // Add float animation to inputs on focus (CSS would be cleaner, but using JS for consistency with prompt request for vanilla JS interactions)
        const inputs = document.querySelectorAll('.food-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('translate-x-1');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('translate-x-1');
            });
        });
    </script>
