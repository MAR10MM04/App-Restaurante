<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes subtle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-subtle-bounce {
            animation: subtle-bounce 3s ease-in-out infinite;
        }

        @keyframes spinner-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .animate-spinner-slow {
            animation: spinner-slow 1.5s linear infinite;
        }

        .orange-mesh-overlay {
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-primary-container min-h-screen flex flex-col items-center justify-between selection:bg-white selection:text-primary overflow-hidden">
<!-- Atmospheric Background Layers -->
<div class="fixed inset-0 pointer-events-none">
<div class="absolute inset-0 orange-mesh-overlay opacity-30"></div>
<div class="absolute -top-1/4 -right-1/4 w-full h-full bg-white opacity-5 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-1/4 -left-1/4 w-full h-full bg-black opacity-5 blur-[120px] rounded-full"></div>
</div>
<!-- Top Spacer (Flex alignment) -->
<div class="h-16"></div>
<!-- Main Identity Centerpiece -->
<main class="relative flex-grow flex flex-col items-center justify-center w-full px-margin-mobile">
<div class="relative group cursor-default">
<!-- Logo Glow -->
<div class="absolute inset-0 bg-white opacity-10 blur-3xl group-hover:opacity-20 transition-opacity duration-700"></div>
<!-- Branding Container -->
<div class="relative flex flex-col items-center gap-6 animate-subtle-bounce">
<div class="bg-white p-8 rounded-[40px] shadow-[0px_20px_50px_rgba(0,0,0,0.1)] flex items-center justify-center transform transition-transform duration-500 hover:scale-105">
<span class="material-symbols-outlined text-[80px] text-primary-container" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-primary tracking-tighter drop-shadow-sm">
                    DiDi Food
                </h1>
<p class="font-body-lg text-body-lg text-white/90 text-center max-w-xs px-4 opacity-0 animate-[fadeIn_1s_ease-out_0.5s_forwards]">
                    La comida que amas, entregada a tu puerta.
                </p>
</div>
</div>
</main>
<!-- Footer Controls & Loading -->
<footer class="w-full flex flex-col items-center gap-12 pb-16 px-margin-mobile z-10">
<!-- Subtle Spinner Container -->
<div class="flex flex-col items-center gap-4 transition-opacity duration-500" id="loader-box">
<div class="w-10 h-10 border-4 border-white/20 border-t-white rounded-full animate-spinner-slow"></div>
<span class="font-label-sm text-label-sm text-white/70 uppercase tracking-widest">Localizando restaurantes...</span>
</div>
<!-- Action Button -->
<div class="w-full max-w-md transform translate-y-4 opacity-0 animate-[slideUp_0.8s_ease-out_1.2s_forwards]">
<button class="group relative w-full h-16 bg-white text-primary-container font-headline-md text-headline-md rounded-full shadow-2xl overflow-hidden active:scale-95 transition-all duration-300 hover:shadow-white/20" onclick="window.location.reload()">
<div class="absolute inset-0 bg-black/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="relative z-10">Comenzar</span>
<!-- Interaction Shine -->
<div class="absolute top-0 -left-full w-1/2 h-full bg-gradient-to-r from-transparent via-white/50 to-transparent skew-x-[-25deg] group-hover:animate-[shimmer_0.8s_ease-in-out]"></div>
</button>
</div>
</footer>
<style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 150%; }
        }
    </style>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader-box');
            
            // Simulate a "ready" state after some time
            setTimeout(() => {
                loader.classList.add('opacity-40');
            }, 3000);

            // Optional: Background mouse follow effect
            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                const moveX = (x - 0.5) * 20;
                const moveY = (y - 0.5) * 20;
                
                document.querySelector('.animate-subtle-bounce').style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
<script src="/bridge.js"></script></body></html>
